name: build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Install
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend-yadot-interface

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend-yadot-interface/app/build/outputs/apk/debug/